services:
  jenkins:
    build: .
    image: mikecozier/jenkins-terraform:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "50000:50000"
    dns:
      - 192.168.1.234  # Pi-hole
      - 1.1.1.1     # Fallback (optional)
    volumes:
      - jenkins_home:/var/jenkins_home
      - /etc/vault/approle:/etc/vault/approle:ro
      - /opt/jenkins-ssh/id_ed25519:/var/jenkins_home/.ssh/id_ed25519:ro
      - /opt/jenkins-ssh/id_ed25519.pub:/var/jenkins_home/.ssh/id_ed25519.pub:ro
volumes:
  jenkins_home:
