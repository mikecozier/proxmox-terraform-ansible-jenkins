mkdir -p ansible
cat > ansible/site.yml <<'EOF'
- name: Baseline setup for new Proxmox VMs
  hosts: proxmox_vms
  become: true
  gather_facts: true

  tasks:
    - name: Wait for SSH to be ready
      wait_for_connection:
        timeout: 300

    - name: Wait for cloud-init to finish (if present)
      shell: |
        if command -v cloud-init >/dev/null 2>&1; then
          cloud-init status --wait
        else
          echo "cloud-init not installed"
        fi
      changed_when: false

    - name: Update apt cache
      apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install baseline packages
      apt:
        name:
          - qemu-guest-agent
          - curl
          - git
          - unzip
          - ca-certificates
          - python3
          - python3-apt
        state: present

    - name: Ensure qemu-guest-agent is enabled and running
      systemd:
        name: qemu-guest-agent
        enabled: true
        state: started

    - name: Ensure OpenSSH server is enabled and running
      systemd:
        name: ssh
        enabled: true
        state: started

    - name: Create a standard admin group (optional)
      group:
        name: admin
        state: present

    - name: Add mirage to admin group (optional)
      user:
        name: mirage
        groups: admin
        append: true

    - name: Passwordless sudo for admin group (recommended for CI)
      copy:
        dest: /etc/sudoers.d/90-admin-nopasswd
        content: "%admin ALL=(ALL) NOPASSWD:ALL\n"
        owner: root
        group: root
        mode: "0440"
EOF

