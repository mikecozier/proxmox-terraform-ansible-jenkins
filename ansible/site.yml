---
- name: Baseline + Vault-signed SSH cert + Node Exporter + Prometheus target update (sanitized)
  hosts: proxmox_vms
  become: true
  gather_facts: true

  vars:
    # ---------------------------
    # Vault (NO UNSEAL HERE)
    # ---------------------------
    vault_addr: "{{ lookup('env', 'VAULT_ADDR') | default('http://vault.service:8200', true) }}"
    vault_approle_mount: "{{ lookup('env', 'VAULT_APPROLE_MOUNT') | default('approle', true) }}"
    vault_sign_path: "{{ lookup('env', 'VAULT_SIGN_PATH') | default('ssh/sign/default', true) }}"
    vault_valid_principals: "{{ lookup('env', 'VAULT_VALID_PRINCIPALS') | default('user', true) }}"
    vault_ttl: "{{ lookup('env', 'VAULT_TTL') | default('168h', true) }}"

    # AppRole creds should come from CI secrets/env, NOT from files in the repo or container FS
    vault_role_id: "{{ lookup('env', 'VAULT_ROLE_ID') | default('', true) }}"
    vault_secret_id: "{{ lookup('env', 'VAULT_SECRET_ID') | default('', true) }}"

    # ---------------------------
    # VM user / SSH cert paths
    # ---------------------------
    vm_user: "{{ lookup('env', 'VM_USER') | default('ubuntu', true) }}"
    ssh_key_path: "/home/{{ vm_user }}/.ssh/id_ed25519"
    ssh_pub_path: "/home/{{ vm_user }}/.ssh/id_ed25519.pub"
    ssh_cert_path: "/home/{{ vm_user }}/.ssh/id_ed25519-cert.pub"

    baseline_packages:
      - qemu-guest-agent
      - curl
      - unzip
      - jq
      - openssh-client

    # ---------------------------
    # Node Exporter (Docker on VM)
    # ---------------------------
    enable_node_exporter: true
    node_exporter_image: "prom/node-exporter"
    node_exporter_version: "latest"
    node_exporter_port: 9100

    docker_packages:
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
      - python3-docker

    # ---------------------------
    # Prometheus update on mainserver (file_sd)
    # ---------------------------
    enable_prometheus_target_update: true
    mainserver_host: "{{ lookup('env', 'MAINSERVER_HOST') | default('mainserver', true) }}"
    mainserver_user: "{{ lookup('env', 'MAINSERVER_USER') | default('ubuntu', true) }}"
    mainserver_ssh_key: "{{ lookup('env', 'MAINSERVER_SSH_KEY') | default('~/.ssh/id_ed25519', true) }}"

    # file_sd target file (preferred)
    prometheus_file_sd_dir: "{{ lookup('env', 'PROM_FILE_SD_DIR') | default('/etc/prometheus/file_sd', true) }}"
    prometheus_node_targets_file: "{{ prometheus_file_sd_dir }}/node_exporter_targets.yml"

    prometheus_compose_dir: "{{ lookup('env', 'PROM_COMPOSE_DIR') | default('/opt/monitoring', true) }}"
    prometheus_service_name: "{{ lookup('env', 'PROM_SERVICE_NAME') | default('prometheus', true) }}"

  handlers:
    - name: Restart Prometheus on mainserver
      when: enable_prometheus_target_update | bool
      delegate_to: "{{ mainserver_host }}"
      become: true
      vars:
        ansible_user: "{{ mainserver_user }}"
        ansible_ssh_private_key_file: "{{ mainserver_ssh_key }}"
      ansible.builtin.shell: |
        set -euo pipefail
        cd {{ prometheus_compose_dir }}
        docker compose restart {{ prometheus_service_name }}
      args:
        executable: /bin/bash

  tasks:
    # ---------------------------
    # VM baseline
    # ---------------------------
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install baseline packages
      ansible.builtin.apt:
        name: "{{ baseline_packages }}"
        state: present

    - name: Ensure qemu-guest-agent is enabled and running
      ansible.builtin.service:
        name: qemu-guest-agent
        enabled: true
        state: started

    # ---------------------------
    # Node Exporter via Docker
    # ---------------------------
    - name: Install Docker prerequisites + python3-docker
      when: enable_node_exporter | bool
      ansible.builtin.apt:
        name: "{{ docker_packages }}"
        state: present

    - name: Install Docker Engine (get.docker.com) if missing
      when: enable_node_exporter | bool
      ansible.builtin.shell: |
        set -euo pipefail
        if ! command -v docker >/dev/null 2>&1; then
          curl -fsSL https://get.docker.com | sh
        fi
      args:
        executable: /bin/bash

    - name: Ensure Docker service is running
      when: enable_node_exporter | bool
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Run node_exporter container
      when: enable_node_exporter | bool
      community.docker.docker_container:
        name: node_exporter
        image: "{{ node_exporter_image }}:{{ node_exporter_version }}"
        state: started
        restart_policy: unless-stopped
        network_mode: host
        pid_mode: host
        volumes:
          - /proc:/host/proc:ro
          - /sys:/host/sys:ro
          - /:/rootfs:ro
        command: >
          --path.procfs=/host/proc
          --path.sysfs=/host/sys
          --path.rootfs=/rootfs
          --web.listen-address=:{{ node_exporter_port }}

    # ---------------------------
    # SSH keypair + cert paths (on VM)
    # ---------------------------
    - name: Ensure ~/.ssh exists
      ansible.builtin.file:
        path: "/home/{{ vm_user }}/.ssh"
        state: directory
        owner: "{{ vm_user }}"
        group: "{{ vm_user }}"
        mode: "0700"

    - name: Ensure ed25519 keypair exists
      become_user: "{{ vm_user }}"
      community.crypto.openssh_keypair:
        path: "{{ ssh_key_path }}"
        type: ed25519
        mode: "0600"

    - name: Read remote public key
      ansible.builtin.slurp:
        src: "{{ ssh_pub_path }}"
      register: remote_pub

    # ---------------------------
    # Vault AppRole login + signing (runs on control node)
    # ---------------------------
    - name: Fail fast if Vault AppRole env vars missing
      delegate_to: localhost
      become: false
      ansible.builtin.assert:
        that:
          - vault_role_id | length > 0
          - vault_secret_id | length > 0
        fail_msg: "Missing VAULT_ROLE_ID / VAULT_SECRET_ID (set as CI secrets/env vars)."

    - name: AppRole login to Vault
      delegate_to: localhost
      become: false
      ansible.builtin.uri:
        url: "{{ vault_addr }}/v1/auth/{{ vault_approle_mount }}/login"
        method: POST
        body_format: json
        body:
          role_id: "{{ vault_role_id }}"
          secret_id: "{{ vault_secret_id }}"
        return_content: true
        status_code: [200, 400, 403]
      register: vault_login_raw
      no_log: true
      failed_when: false

    - name: Fail with Vault error message if login failed
      delegate_to: localhost
      become: false
      ansible.builtin.fail:
        msg: >-
          Vault AppRole login failed (HTTP {{ vault_login_raw.status }}).
          {{ (vault_login_raw.json.errors | default(vault_login_raw.content | default(''))) }}
      when: vault_login_raw.status != 200

    - name: Extract Vault token
      delegate_to: localhost
      become: false
      ansible.builtin.set_fact:
        vault_token: "{{ vault_login_raw.json.auth.client_token }}"
      no_log: true

    - name: Sign this host's key via Vault
      delegate_to: localhost
      become: false
      ansible.builtin.uri:
        url: "{{ vault_addr }}/v1/{{ vault_sign_path }}"
        method: POST
        headers:
          X-Vault-Token: "{{ vault_token }}"
        body_format: json
        body:
          public_key: "{{ remote_pub.content | b64decode | trim }}"
          valid_principals: "{{ vault_valid_principals }}"
          ttl: "{{ vault_ttl }}"
        return_content: true
        status_code: 200
      register: signed
      no_log: true

    - name: Install signed cert on VM
      ansible.builtin.copy:
        content: "{{ signed.json.data.signed_key }}"
        dest: "{{ ssh_cert_path }}"
        owner: "{{ vm_user }}"
        group: "{{ vm_user }}"
        mode: "0644"

    # ---------------------------
    # Prometheus update on mainserver (file_sd)
    # ---------------------------
    - name: Ensure file_sd dir exists on mainserver
      when:
        - enable_node_exporter | bool
        - enable_prometheus_target_update | bool
      delegate_to: "{{ mainserver_host }}"
      become: true
      vars:
        ansible_user: "{{ mainserver_user }}"
        ansible_ssh_private_key_file: "{{ mainserver_ssh_key }}"
      ansible.builtin.file:
        path: "{{ prometheus_file_sd_dir }}"
        state: directory
        mode: "0755"

    - name: Add this VM to file_sd node_exporter targets (idempotent)
      when:
        - enable_node_exporter | bool
        - enable_prometheus_target_update | bool
      delegate_to: "{{ mainserver_host }}"
      become: true
      vars:
        ansible_user: "{{ mainserver_user }}"
        ansible_ssh_private_key_file: "{{ mainserver_ssh_key }}"
      ansible.builtin.blockinfile:
        path: "{{ prometheus_node_targets_file }}"
        create: true
        mode: "0644"
        marker: "# {mark} ANSIBLE MANAGED TARGET {{ inventory_hostname }}"
        block: |
          - targets:
              - "{{ hostvars[inventory_hostname].ansible_host | default(inventory_hostname) }}:{{ node_exporter_port }}"
            labels:
              job: "node"
              instance: "{{ inventory_hostname }}"
      notify: Restart Prometheus on mainserver

