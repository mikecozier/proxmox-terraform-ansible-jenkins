---
- name: Baseline setup for new Proxmox VMs
  hosts: proxmox_vms
  become: true

  tasks:
    - name: Update apt cache
      apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install baseline packages
      apt:
        name:
          - curl
          - vim
          - git
          - qemu-guest-agent
        state: present

    - name: Ensure qemu-guest-agent is enabled and running
      service:
        name: qemu-guest-agent
        enabled: true
        state: started

