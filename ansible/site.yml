---
- name: Baseline + Vault-signed SSH cert for new Proxmox VMs
  hosts: proxmox_vms
  become: true
  gather_facts: true

  vars:
    # --- Vault (runs on Jenkins container via delegate_to: localhost) ---
    vault_addr: "http://192.168.1.23:8200"
    vault_role_id_file: "/etc/vault/approle/role_id"
    vault_secret_id_file: "/etc/vault/approle/secret_id"
    vault_sign_path: "ssh/sign/mirage"
    vault_valid_principals: "mirage"
    vault_ttl: "168h"

    # Vault unseal keys (pulled from Jenkins environment variables)
    vault_unseal_keys:
      - "{{ lookup('env', 'VAULT_UNSEAL_KEY_1') }}"
      - "{{ lookup('env', 'VAULT_UNSEAL_KEY_2') }}"
      - "{{ lookup('env', 'VAULT_UNSEAL_KEY_3') }}"

    # --- VM SSH key + cert paths ---
    vm_user: "mirage"
    ssh_key_path: "/home/mirage/.ssh/id_ed25519"
    ssh_pub_path: "/home/mirage/.ssh/id_ed25519.pub"
    ssh_cert_path: "/home/mirage/.ssh/id_ed25519-cert.pub"

    # Baseline packages
    baseline_packages:
      - qemu-guest-agent
      - curl
      - unzip
      - jq
      - openssh-client

  tasks:
    # --- Vault unseal logic (runs in Jenkins container) ---
    - name: Fail fast if any unseal key env var is missing
      delegate_to: localhost
      become: false
      ansible.builtin.assert:
        that:
          - vault_unseal_keys[0] | length > 0
          - vault_unseal_keys[1] | length > 0
          - vault_unseal_keys[2] | length > 0
        fail_msg: "Missing one or more VAULT_UNSEAL_KEY_1/2/3 environment variables in Jenkins."

    - name: Check if Vault is sealed
      delegate_to: localhost
      become: false
      ansible.builtin.uri:
        url: "{{ vault_addr }}/v1/sys/seal-status"
        method: GET
        return_content: true
        status_code: 200
      register: vault_seal_status

    - name: Unseal Vault using provided keys (only if sealed)
      delegate_to: localhost
      become: false
      when: vault_seal_status.json.sealed | bool
      block:

        - name: Submit unseal keys until Vault is unsealed
          ansible.builtin.uri:
            url: "{{ vault_addr }}/v1/sys/unseal"
            method: POST
            body_format: json
            body:
              key: "{{ item }}"
            status_code: [200, 400]
            return_content: true
          loop: "{{ vault_unseal_keys }}"
          loop_control:
            label: "unseal_key_{{ ansible_loop.index }}"
          register: unseal_results
          no_log: true
          failed_when: false

        - name: Re-check seal status after unseal attempts
          ansible.builtin.uri:
            url: "{{ vault_addr }}/v1/sys/seal-status"
            method: GET
            return_content: true
            status_code: 200
          register: vault_seal_status_after

        - name: Fail if Vault is still sealed
          ansible.builtin.fail:
            msg: "Vault is still sealed after applying all unseal keys."
          when: vault_seal_status_after.json.sealed | bool

    # --- VM baseline tasks (run on the VM) ---
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install baseline packages
      ansible.builtin.apt:
        name: "{{ baseline_packages }}"
        state: present

    - name: Ensure qemu-guest-agent is enabled and running
      ansible.builtin.service:
        name: qemu-guest-agent
        enabled: true
        state: started

    - name: Ensure ~/.ssh exists for {{ vm_user }}
      ansible.builtin.file:
        path: "/home/{{ vm_user }}/.ssh"
        state: directory
        owner: "{{ vm_user }}"
        group: "{{ vm_user }}"
        mode: "0700"

    - name: Ensure ed25519 keypair exists for {{ vm_user }}
      become_user: "{{ vm_user }}"
      community.crypto.openssh_keypair:
        path: "{{ ssh_key_path }}"
        type: ed25519
        mode: "0600"

    - name: Read remote public key
      ansible.builtin.slurp:
        src: "{{ ssh_pub_path }}"
      register: remote_pub

    # --- Vault signing (runs in Jenkins container) ---
    - name: AppRole login to Vault (from Jenkins container)
      delegate_to: localhost
      become: false
      ansible.builtin.uri:
        url: "{{ vault_addr }}/v1/auth/approle/login"
        method: POST
        body_format: json
        body:
          role_id: "{{ lookup('file', vault_role_id_file) | trim }}"
          secret_id: "{{ lookup('file', vault_secret_id_file) | trim }}"
        return_content: true
        status_code: 200
      register: vault_login
      no_log: true

    - name: Sign this host's key via Vault (from Jenkins container)
      delegate_to: localhost
      become: false
      ansible.builtin.uri:
        url: "{{ vault_addr }}/v1/{{ vault_sign_path }}"
        method: POST
        headers:
          X-Vault-Token: "{{ vault_login.json.auth.client_token }}"
        body_format: json
        body:
          public_key: "{{ remote_pub.content | b64decode | trim }}"
          valid_principals: "{{ vault_valid_principals }}"
          ttl: "{{ vault_ttl }}"
        return_content: true
        status_code: 200
      register: signed
      no_log: true

    - name: Install signed cert on VM
      ansible.builtin.copy:
        content: "{{ signed.json.data.signed_key }}"
        dest: "{{ ssh_cert_path }}"
        owner: "{{ vm_user }}"
        group: "{{ vm_user }}"
        mode: "0644"

