---
- name: Baseline + Vault-signed SSH cert + Node Exporter + Prometheus target update
  hosts: proxmox_vms
  become: true
  gather_facts: true

  vars:
    # ---------------------------
    # Vault
    # ---------------------------
    vault_addr: "http://192.168.1.23:8200"
    vault_approle_mount: "approle"
    vault_role_id_file: "/etc/vault/approle/role_id"
    vault_secret_id_file: "/etc/vault/approle/secret_id"

    vault_sign_path: "ssh/sign/mirage"
    vault_valid_principals: "mirage"
    vault_ttl: "168h"

    vault_unseal_keys:
      - "{{ lookup('env', 'VAULT_UNSEAL_KEY_1') }}"
      - "{{ lookup('env', 'VAULT_UNSEAL_KEY_2') }}"
      - "{{ lookup('env', 'VAULT_UNSEAL_KEY_3') }}"

    # ---------------------------
    # VM user / SSH cert paths
    # ---------------------------
    vm_user: "mirage"
    ssh_key_path: "/home/{{ vm_user }}/.ssh/id_ed25519"
    ssh_pub_path: "/home/{{ vm_user }}/.ssh/id_ed25519.pub"
    ssh_cert_path: "/home/{{ vm_user }}/.ssh/id_ed25519-cert.pub"

    baseline_packages:
      - qemu-guest-agent
      - curl
      - unzip
      - jq
      - openssh-client

    # ---------------------------
    # Node Exporter (Docker on VM)
    # ---------------------------
    enable_node_exporter: true
    node_exporter_image: "prom/node-exporter"
    node_exporter_version: "latest"
    node_exporter_port: 9100

    # Key fix for Ubuntu 24.04 / Python 3.12 (PEP 668): don't pip install docker system-wide
    docker_packages:
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
      - python3-docker

    # ---------------------------
    # Prometheus update on mainserver
    # ---------------------------
    enable_prometheus_target_update: true

    mainserver_ip: "192.168.1.234"
    mainserver_user: "mirage"
    # Key must exist INSIDE Jenkins container (or on the control node running ansible-playbook)
    mainserver_ssh_key: "/var/jenkins_home/.ssh/id_ed25519"

    prometheus_config_path: "/home/mirage/docker/docker-stack-private/config/prometheus.yml"
    prometheus_compose_dir: "/home/mirage/docker/docker-stack-private"
    prometheus_service_name: "prometheus"

  handlers:
    - name: Restart Prometheus on mainserver
      when: enable_prometheus_target_update | bool
      delegate_to: "{{ mainserver_ip }}"
      become: true
      vars:
        ansible_user: "{{ mainserver_user }}"
        ansible_ssh_private_key_file: "{{ mainserver_ssh_key }}"
      ansible.builtin.shell: |
        set -euo pipefail
        cd {{ prometheus_compose_dir }}
        docker compose restart {{ prometheus_service_name }}
      args:
        executable: /bin/bash

  tasks:
    # ---------------------------
    # Vault unseal (runs on Jenkins/control node)
    # ---------------------------
    - name: Fail fast if any unseal key env var is missing
      delegate_to: localhost
      become: false
      ansible.builtin.assert:
        that:
          - vault_unseal_keys[0] | length > 0
          - vault_unseal_keys[1] | length > 0
          - vault_unseal_keys[2] | length > 0
        fail_msg: "Missing one or more VAULT_UNSEAL_KEY_1/2/3 environment variables in Jenkins."

    - name: Check if Vault is sealed
      delegate_to: localhost
      become: false
      ansible.builtin.uri:
        url: "{{ vault_addr }}/v1/sys/seal-status"
        method: GET
        return_content: true
        status_code: 200
      register: vault_seal_status

    - name: Unseal Vault (only if sealed)
      delegate_to: localhost
      become: false
      when: vault_seal_status.json.sealed | bool
      block:
        - name: Submit unseal keys (do not fail inside loop)
          ansible.builtin.uri:
            url: "{{ vault_addr }}/v1/sys/unseal"
            method: POST
            body_format: json
            body:
              key: "{{ item }}"
            return_content: true
            status_code: [200, 400, 403, 500, 503]
            timeout: 10
          loop: "{{ vault_unseal_keys }}"
          loop_control:
            label: "unseal_key_{{ ansible_loop.index }}"
          register: unseal_results
          no_log: true
          failed_when: false
          ignore_errors: true

        - name: Final seal status check
          ansible.builtin.uri:
            url: "{{ vault_addr }}/v1/sys/seal-status"
            method: GET
            return_content: true
            status_code: 200
          register: vault_seal_status_after

        - name: Fail if Vault is still sealed
          ansible.builtin.fail:
            msg: "Vault is still sealed after unseal attempts."
          when: vault_seal_status_after.json.sealed | bool

    # ---------------------------
    # VM baseline (runs on VM)
    # ---------------------------
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install baseline packages
      ansible.builtin.apt:
        name: "{{ baseline_packages }}"
        state: present

    - name: Ensure qemu-guest-agent is enabled and running
      ansible.builtin.service:
        name: qemu-guest-agent
        enabled: true
        state: started

    # ---------------------------
    # Node Exporter via Docker (runs on VM)
    # ---------------------------
    - name: Install Docker prerequisites + python3-docker (apt)
      when: enable_node_exporter | bool
      ansible.builtin.apt:
        name: "{{ docker_packages }}"
        state: present

    - name: Install Docker Engine (get.docker.com) if missing
      when: enable_node_exporter | bool
      ansible.builtin.shell: |
        set -euo pipefail
        if ! command -v docker >/dev/null 2>&1; then
          curl -fsSL https://get.docker.com | sh
        fi
      args:
        executable: /bin/bash

    - name: Ensure Docker service is running
      when: enable_node_exporter | bool
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Run node_exporter container
      when: enable_node_exporter | bool
      community.docker.docker_container:
        name: node_exporter
        image: "{{ node_exporter_image }}:{{ node_exporter_version }}"
        state: started
        restart_policy: unless-stopped
        network_mode: host
        pid_mode: host
        volumes:
          - /proc:/host/proc:ro
          - /sys:/host/sys:ro
          - /:/rootfs:ro
        command: >
          --path.procfs=/host/proc
          --path.sysfs=/host/sys
          --path.rootfs=/rootfs
          --web.listen-address=:{{ node_exporter_port }}

    # ---------------------------
    # SSH keypair + cert paths (runs on VM)
    # ---------------------------
    - name: Ensure ~/.ssh exists for {{ vm_user }}
      ansible.builtin.file:
        path: "/home/{{ vm_user }}/.ssh"
        state: directory
        owner: "{{ vm_user }}"
        group: "{{ vm_user }}"
        mode: "0700"

    - name: Ensure ed25519 keypair exists for {{ vm_user }}
      become_user: "{{ vm_user }}"
      community.crypto.openssh_keypair:
        path: "{{ ssh_key_path }}"
        type: ed25519
        mode: "0600"

    - name: Read remote public key
      ansible.builtin.slurp:
        src: "{{ ssh_pub_path }}"
      register: remote_pub

    # ---------------------------
    # Vault AppRole + signing (runs on Jenkins/control node)
    # ---------------------------
    - name: Read role_id / secret_id from files in Jenkins container
      delegate_to: localhost
      become: false
      ansible.builtin.set_fact:
        vault_role_id: "{{ lookup('file', vault_role_id_file) | regex_replace('\\s+$', '') }}"
        vault_secret_id: "{{ lookup('file', vault_secret_id_file) | regex_replace('\\s+$', '') }}"

    - name: Fail fast if role_id/secret_id are empty
      delegate_to: localhost
      become: false
      ansible.builtin.assert:
        that:
          - vault_role_id | length > 0
          - vault_secret_id | length > 0
        fail_msg: "role_id/secret_id are empty in Jenkins container."

    - name: AppRole login to Vault (capture error body)
      delegate_to: localhost
      become: false
      ansible.builtin.uri:
        url: "{{ vault_addr }}/v1/auth/{{ vault_approle_mount }}/login"
        method: POST
        body_format: json
        body:
          role_id: "{{ vault_role_id }}"
          secret_id: "{{ vault_secret_id }}"
        return_content: true
        status_code: [200, 400, 403]
      register: vault_login_raw
      no_log: true
      failed_when: false

    - name: Fail with Vault error message if AppRole login failed
      delegate_to: localhost
      become: false
      ansible.builtin.fail:
        msg: >-
          Vault AppRole login failed (HTTP {{ vault_login_raw.status }}).
          {{ (vault_login_raw.json.errors | default(vault_login_raw.content | default(''))) }}
      when: vault_login_raw.status != 200

    - name: Extract Vault token
      delegate_to: localhost
      become: false
      ansible.builtin.set_fact:
        vault_token: "{{ vault_login_raw.json.auth.client_token }}"
      no_log: true

    - name: Sign this host's key via Vault
      delegate_to: localhost
      become: false
      ansible.builtin.uri:
        url: "{{ vault_addr }}/v1/{{ vault_sign_path }}"
        method: POST
        headers:
          X-Vault-Token: "{{ vault_token }}"
        body_format: json
        body:
          public_key: "{{ remote_pub.content | b64decode | trim }}"
          valid_principals: "{{ vault_valid_principals }}"
          ttl: "{{ vault_ttl }}"
        return_content: true
        status_code: 200
      register: signed
      no_log: true

    - name: Install signed cert on VM
      ansible.builtin.copy:
        content: "{{ signed.json.data.signed_key }}"
        dest: "{{ ssh_cert_path }}"
        owner: "{{ vm_user }}"
        group: "{{ vm_user }}"
        mode: "0644"

    # ---------------------------
    # Update Prometheus on mainserver (add this VM target)
    # NOTE: This runs from Jenkins/control node to mainserver over SSH.
    # ---------------------------
    - name: Add this VM to Prometheus node_exporter targets on mainserver (idempotent)
      when:
        - enable_node_exporter | bool
        - enable_prometheus_target_update | bool
      delegate_to: "{{ mainserver_ip }}"
      become: true
      vars:
        ansible_user: "{{ mainserver_user }}"
        ansible_ssh_private_key_file: "{{ mainserver_ssh_key }}"
      ansible.builtin.lineinfile:
        path: "{{ prometheus_config_path }}"
        insertafter: '^\s*# BEGIN ANSIBLE MANAGED NODE EXPORTER TARGETS'
        line: "          - '{{ hostvars[inventory_hostname].ansible_host | default(inventory_hostname) }}:{{ node_exporter_port }}'  # {{ inventory_hostname }}"
        state: present
      notify: Restart Prometheus on mainserver
